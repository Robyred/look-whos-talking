name: tests

on:
  push:
  pull_request:

# A new push to the same branch cancels the previous run, so superseded commits
# do not burn Actions minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Report key versions
        run: pip list 2>/dev/null | grep -Ei "^(torch|torchaudio|torchvision|torchcodec|pyannote|whisperx|fastapi|pytest) " || true

      - name: Run tests
        run: pytest -q
