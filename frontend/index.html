<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Look Who's Talking</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container { max-width: 720px; margin: 0 auto; }

    h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.25rem; }
    .subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 2rem; }

    /* Upload card */
    .card {
      background: #1e2130;
      border: 1px solid #2d3148;
      border-radius: 0.75rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }

    .upload-area {
      border: 2px dashed #2d3148;
      border-radius: 0.5rem;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .upload-area:hover, .upload-area.drag-over { border-color: #6366f1; }
    .upload-area input[type="file"] { display: none; }
    .upload-area .hint { color: #64748b; font-size: 0.85rem; margin-top: 0.5rem; }
    #file-label { color: #6366f1; font-weight: 500; }

    button {
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 0.5rem;
      padding: 0.6rem 1.25rem;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 1rem;
      transition: background 0.2s;
    }
    button:hover:not(:disabled) { background: #4f46e5; }
    button:disabled { background: #374151; color: #6b7280; cursor: not-allowed; }

    /* Status */
    .status-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem;
      background: #1e2130;
      border: 1px solid #2d3148;
      border-radius: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .spinner {
      width: 1.25rem; height: 1.25rem;
      border: 2px solid #2d3148;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-text { font-size: 0.9rem; }
    .status-text .dim { color: #64748b; font-size: 0.8rem; }

    /* Results */
    .result-meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .meta-item { text-align: center; }
    .meta-item .value { font-size: 1.5rem; font-weight: 700; color: #e2e8f0; }
    .meta-item .label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; }

    .speaker-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .speaker-row { }
    .speaker-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 0.3rem;
    }
    .speaker-name { font-weight: 600; }
    .speaker-pct { color: #94a3b8; }
    .bar-track {
      height: 0.5rem;
      background: #2d3148;
      border-radius: 9999px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 9999px;
      transition: width 0.6s ease;
    }

    .speaker-colors { --c0:#6366f1; --c1:#22d3ee; --c2:#f59e0b; --c3:#ec4899; --c4:#10b981; }

    /* Past conversations */
    .convo-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .convo-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: #161824;
      border: 1px solid #2d3148;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .convo-item:hover { border-color: #6366f1; }
    .convo-filename { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; }
    .convo-meta { color: #64748b; font-size: 0.8rem; white-space: nowrap; }

    .error-box {
      background: #2d1515;
      border: 1px solid #7f1d1d;
      border-radius: 0.5rem;
      padding: 1rem;
      color: #fca5a5;
      font-size: 0.875rem;
    }

    /* Transcript */
    .transcript {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-height: 20rem;
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .utterance { display: flex; gap: 0.75rem; }
    .utt-speaker {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
      padding-top: 0.15rem;
      min-width: 80px;
    }
    .utt-text { font-size: 0.875rem; line-height: 1.6; color: #cbd5e1; }
    .utt-time { font-size: 0.7rem; color: #475569; margin-top: 0.2rem; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="container speaker-colors">

  <h1>Look Who's Talking</h1>
  <p class="subtitle">Speaker diarisation — upload a conversation to see who said what</p>

  <!-- Upload -->
  <div class="card">
    <h2>Analyse a conversation</h2>
    <div class="upload-area" id="drop-zone">
      <input type="file" id="file-input" accept=".wav,.mp3,.m4a">
      <label for="file-input" id="file-label">Choose an audio file</label>
      <p class="hint" id="file-hint">or drag and drop — WAV, MP3, M4A</p>
    </div>
    <button id="submit-btn" disabled>Analyse</button>
  </div>

  <!-- Job status -->
  <div class="status-row hidden" id="status-row">
    <div class="spinner"></div>
    <div class="status-text">
      <div id="status-label">Submitting…</div>
      <div class="dim" id="status-id"></div>
    </div>
  </div>

  <!-- Error -->
  <div class="error-box hidden" id="error-box"></div>

  <!-- Results -->
  <div class="card hidden" id="result-card">
    <h2 id="result-filename"></h2>
    <div class="result-meta">
      <div class="meta-item">
        <div class="value" id="meta-speakers">—</div>
        <div class="label">Speakers</div>
      </div>
      <div class="meta-item">
        <div class="value" id="meta-duration">—</div>
        <div class="label">Duration</div>
      </div>
      <div class="meta-item">
        <div class="value" id="meta-overlap">—</div>
        <div class="label">Overlap</div>
      </div>
    </div>
    <div class="speaker-list" id="speaker-list"></div>
  </div>

  <!-- Transcript -->
  <div class="card hidden" id="transcript-card">
    <h2 style="font-size:1rem;font-weight:600;margin-bottom:1rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em">Transcript</h2>
    <div class="transcript" id="transcript"></div>
  </div>

  <!-- Past conversations -->
  <div class="card" id="history-card">
    <h2>Past conversations</h2>
    <div class="convo-list" id="convo-list">
      <div style="color:#64748b;font-size:.875rem">No conversations yet.</div>
    </div>
  </div>

</div>

<script>
  const COLORS = ['var(--c0)', 'var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)'];
  const POLL_MS = 2000;

  const fileInput   = document.getElementById('file-input');
  const fileLabel   = document.getElementById('file-label');
  const fileHint    = document.getElementById('file-hint');
  const submitBtn   = document.getElementById('submit-btn');
  const statusRow   = document.getElementById('status-row');
  const statusLabel = document.getElementById('status-label');
  const statusId    = document.getElementById('status-id');
  const errorBox    = document.getElementById('error-box');
  const resultCard  = document.getElementById('result-card');
  const historyCard = document.getElementById('history-card');

  let pollTimer = null;

  // --- file selection ---
  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) {
      fileLabel.textContent = fileInput.files[0].name;
      submitBtn.disabled = false;
    }
  });

  const dropZone = document.getElementById('drop-zone');
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) {
      const dt = new DataTransfer();
      dt.items.add(file);
      fileInput.files = dt.files;
      fileLabel.textContent = file.name;
      submitBtn.disabled = false;
    }
  });

  // --- submit ---
  submitBtn.addEventListener('click', async () => {
    if (!fileInput.files.length) return;

    submitBtn.disabled = true;
    errorBox.classList.add('hidden');
    resultCard.classList.add('hidden');
    statusRow.classList.remove('hidden');
    statusLabel.textContent = 'Submitting…';
    statusId.textContent = '';

    const form = new FormData();
    form.append('file', fileInput.files[0]);

    try {
      const res = await fetch('/api/diarize', { method: 'POST', body: form });
      const job = await res.json();
      if (!res.ok) throw new Error(job.detail || 'Submission failed');
      statusId.textContent = `Job: ${job.job_id}`;
      poll(job.job_id);
    } catch (err) {
      showError(err.message);
    }
  });

  // --- polling ---
  function poll(jobId) {
    statusLabel.textContent = 'Processing…';
    pollTimer = setTimeout(async function check() {
      try {
        const res = await fetch(`/api/jobs/${jobId}`);
        const job = await res.json();

        if (job.status === 'complete') {
          statusRow.classList.add('hidden');
          showResult(job.result);
          loadHistory();
        } else if (job.status === 'failed') {
          statusRow.classList.add('hidden');
          showError(job.error || 'Processing failed');
        } else {
          pollTimer = setTimeout(check, POLL_MS);
        }
      } catch {
        pollTimer = setTimeout(check, POLL_MS);
      }
    }, POLL_MS);
  }

  // --- display result ---
  function fmt(sec) {
    const m = Math.floor(sec / 60), s = Math.round(sec % 60);
    return m > 0 ? `${m}m ${s}s` : `${s}s`;
  }

  function showResult(result) {
    document.getElementById('result-filename').textContent = result.filename;
    document.getElementById('meta-speakers').textContent = result.speaker_count;
    document.getElementById('meta-duration').textContent = fmt(result.total_duration_sec);
    document.getElementById('meta-overlap').textContent = fmt(result.overlap_sec);

    const list = document.getElementById('speaker-list');
    list.innerHTML = '';
    result.speakers.forEach((s, i) => {
      const color = COLORS[i % COLORS.length];
      const pct = Math.min(s.percentage, 100);
      list.innerHTML += `
        <div class="speaker-row">
          <div class="speaker-header">
            <span class="speaker-name" style="color:${color}">${s.speaker_id}</span>
            <span class="speaker-pct">${fmt(s.duration_sec)} &nbsp;·&nbsp; ${s.percentage}%</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${pct}%;background:${color}"></div>
          </div>
        </div>`;
    });

    resultCard.classList.remove('hidden');

    // Build speaker colour map by index in sorted order
    const speakerColors = {};
    result.speakers.forEach((s, i) => { speakerColors[s.speaker_id] = COLORS[i % COLORS.length]; });

    // Transcript
    const transcriptCard = document.getElementById('transcript-card');
    const transcriptEl   = document.getElementById('transcript');
    if (result.transcript && result.transcript.length) {
      transcriptEl.innerHTML = '';
      result.transcript.forEach(u => {
        const color = speakerColors[u.speaker_id] || COLORS[0];
        transcriptEl.innerHTML += `
          <div class="utterance">
            <div>
              <div class="utt-speaker" style="color:${color}">${u.speaker_id}</div>
              <div class="utt-time">${fmt(u.start)}</div>
            </div>
            <div class="utt-text">${u.text}</div>
          </div>`;
      });
      transcriptCard.classList.remove('hidden');
    } else {
      transcriptCard.classList.add('hidden');
    }

    submitBtn.disabled = false;
  }

  // --- error ---
  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.remove('hidden');
    submitBtn.disabled = false;
  }

  // --- history ---
  async function loadHistory() {
    try {
      const res = await fetch('/api/conversations');
      const data = await res.json();
      const list = document.getElementById('convo-list');
      if (!data.conversations.length) {
        list.innerHTML = '<div style="color:#64748b;font-size:.875rem">No conversations yet.</div>';
        return;
      }
      list.innerHTML = data.conversations.map(c => `
        <div class="convo-item">
          <span class="convo-filename">${c.filename}</span>
          <span class="convo-meta">${c.speaker_count} speaker${c.speaker_count !== 1 ? 's' : ''} &nbsp;·&nbsp; ${fmt(c.total_duration_sec)}</span>
        </div>`).join('');
    } catch { /* silently ignore */ }
  }

  loadHistory();
</script>
</body>
</html>
